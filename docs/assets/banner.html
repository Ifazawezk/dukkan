<!doctype html>
<!-- Source of banner.png. Render at 1280x420 with a device scale of 2. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dukkan banner</title>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 420px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        gap: 44px;
        padding: 0 0 0 64px;
        color: #fff;
        font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(120deg, #5c112a 0%, #8a1538 52%, #292524 100%);
      }
      .copy {
        flex: 0 0 470px;
      }
      .name {
        display: flex;
        align-items: baseline;
        gap: 18px;
        margin: 0;
        font-size: 68px;
        font-weight: 700;
        line-height: 1.1;
      }
      .name span {
        font-size: 50px;
        font-weight: 500;
        color: #edc5cf;
      }
      .pitch {
        margin: 14px 0 22px;
        font-size: 25px;
        line-height: 1.35;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 15px;
      }
      .tags li {
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.13);
      }
      .shot {
        flex: 1;
        align-self: flex-end;
        height: 370px;
        overflow: hidden;
        border-radius: 14px 0 0 0;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
      .shot img {
        display: block;
        width: 980px;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <h1 class="name">Dukkan <span>دكان</span></h1>
      <p class="pitch">Open-source point of sale and inventory for small shops in Qatar and the Gulf</p>
      <ul class="tags">
        <li>English and Arabic</li>
        <li>Prices in QAR</li>
        <li>Auditable stock ledger</li>
      </ul>
    </div>
    <div class="shot"><img src="../screenshots/checkout-en.png" alt="" /></div>
  </body>
</html>
